name: Update skills ranking
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_rank.py
      - run: |
          if [ -n "$(git status --porcelain assets/data)" ]; then
            git config user.name "839A rank bot"
            git config user.email "actions@users.noreply.github.com"
            git add assets/data/rank.json assets/data/rank_history.json
            git commit -m "Update skills ranking"
            git push
          fi
